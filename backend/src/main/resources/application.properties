spring.application.name=medicare

# Server
server.port=8080

# MongoDB connection is resolved from the MONGO_URI environment variable by
# com.medicare.util.MongoConnection. It is NEVER hardcoded here.
#   export MONGO_URI="mongodb+srv://user:pass@cluster.mongodb.net/medicare"
#
# Optional tuning (all have safe defaults):
#   MEDICARE_DB_NAME=medicare
#   MEDICARE_CORS_ORIGINS=http://localhost:5173,http://localhost:3000
#   MEDICARE_SEED_DEMO_DATA=true

# Do not use spring.data.mongodb.* — the app talks to MongoDB exclusively through
# the MongoConnection util, mirroring the documented console-app architecture.
spring.main.banner-mode=off

logging.level.root=INFO
logging.level.com.medicare=INFO
